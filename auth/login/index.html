<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Portal | Pearls 360 Design &amp; Planning</title>
  <meta name="description" content="Sign in to access your Pearls360 workspace.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f1f1ef">
  <link rel="icon" type="image/png" href="/src/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <script src="/boot.js"></script>
  <script type="module" src="/src/pages/login.js"></script>
</head>
<body>
<main class="auth">
  <aside class="auth__visual" aria-hidden="true">
    <img class="auth__photo" src="/src/assets/img/login-feature.jpg" alt="" fetchpriority="high">
  </aside>

  <section class="auth__panel" aria-labelledby="auth-title">
    <div class="auth__inner">
      <div class="auth__brand">
        <span class="brand">
          <img class="brand__mark brand__mark--spin" src="/src/assets/img/logo.png" alt="" width="44" height="44">
          <span class="brand__text">PEARLS 360<small>Design &amp; Planning</small></span>
        </span>
      </div>

      <header class="auth__head">
        <span class="eyebrow">Pearls360 Workspace</span>
        <h1 id="auth-title">Employee Portal</h1>
      </header>

      <form class="form auth__form" id="login-form" novalidate>
        <div class="form__alert" id="form-alert" role="alert" tabindex="-1" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/></svg>
          <span data-alert-text></span>
        </div>

        <div class="field" data-field="email">
          <label for="email">Email address</label>
          <div class="field__control">
            <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter your work email" required aria-describedby="email-error">
          </div>
          <p class="field__error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field field--password" data-field="password">
          <label for="password">Password</label>
          <div class="field__control">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required aria-describedby="password-error">
            <button class="field__toggle" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">
              <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <p class="field__error" id="password-error" aria-live="polite"></p>
        </div>

        <button class="btn btn--block" type="submit" data-submit>
          <span data-submit-label>Sign In</span>
        </button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
