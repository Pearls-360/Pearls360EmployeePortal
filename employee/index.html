<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Pearls360 Employee Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f1f1ef">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <script src="/boot.js"></script>
  <script type="module" src="/src/pages/employee.js"></script>
</head>
<body data-auth="pending">
<div class="app" data-shell>
  <aside class="sidebar" data-sidebar></aside>
  <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
  <div class="app-body">
    <header class="topbar" data-topbar></header>
    <main class="app-content" id="main">
      <div class="form__alert" data-page-alert role="alert" hidden><span data-alert-text></span></div>

      <div class="panel-grid panel-grid--3 panel-grid--equal">
        <section class="panel" aria-labelledby="resources-title">
          <div class="panel__head">
            <h2 class="panel__title" id="resources-title">My Resources</h2>
            <a class="link" href="/employee/resources">Browse</a>
          </div>
          <ul class="record-list" data-resource-list></ul>
          <p class="empty" data-resource-empty>Nothing has been published for you yet.</p>
        </section>

        <section class="panel" aria-labelledby="invoices-title">
          <div class="panel__head">
            <h2 class="panel__title" id="invoices-title">My Invoices</h2>
            <a class="link" href="/employee/invoices">Browse</a>
          </div>
          <ul class="record-list" data-invoice-list></ul>
          <p class="empty" data-invoice-empty>You have no invoices yet.</p>
        </section>

        <section class="panel" aria-labelledby="training-title">
          <div class="panel__head">
            <h2 class="panel__title" id="training-title">Training</h2>
            <a class="link" href="/employee/training">Browse</a>
          </div>
          <ul class="record-list" data-training-list></ul>
          <p class="empty" data-training-empty>No training has been shared yet.</p>
        </section>
      </div>
    </main>
  </div>
</div>
</body>
</html>
