<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings | Pearls360 Employee Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f1f1ef">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <script src="/boot.js"></script>
  <script type="module" src="/src/pages/employee-settings.js"></script>
</head>
<body data-auth="pending">
<div class="app" data-shell>
  <aside class="sidebar" data-sidebar></aside>
  <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
  <div class="app-body">
    <header class="topbar" data-topbar></header>
    <main class="app-content" id="main">
      <section class="dash-intro">
        <span class="eyebrow">Account</span>
        <h1>Settings</h1>
        <p>Security preferences for your employee account.</p>
      </section>

      <div class="panel-grid">
        <section class="panel panel--wide" aria-labelledby="password-title">
          <div class="panel__head">
            <div>
              <h2 class="panel__title" id="password-title">Change Password</h2>
              <p>Changing your password signs you out on every other device.</p>
            </div>
          </div>
          <form class="form" id="change-password-form" novalidate>
            <div class="form__alert" data-alert role="alert" tabindex="-1" hidden><span data-alert-text></span></div>
            <input type="email" name="username" autocomplete="username" hidden data-username>
            <div class="form-grid">
              <div class="field full">
                <label for="currentPassword">Current password</label>
                <div class="field__control"><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
              </div>
              <div class="field field--password">
                <label for="newPassword">New password</label>
                <div class="field__control">
                  <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="newPassword-hint">
                  <button class="field__toggle" type="button" aria-controls="newPassword" aria-pressed="false" aria-label="Show password">
                    <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.7 17.7 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                  </button>
                </div>
                <p class="field__hint" id="newPassword-hint">At least 12 characters.</p>
              </div>
              <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <div class="field__control"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required></div>
              </div>
            </div>
            <div class="form-actions"><button class="btn" type="submit">Update Password</button></div>
          </form>
        </section>

        <section class="panel" aria-labelledby="appearance-title">
          <div class="panel__head">
            <div>
              <h2 class="panel__title" id="appearance-title">Appearance</h2>
              <p>On is dark. Off is light.</p>
            </div>
          </div>
          <label class="theme-toggle">
            <input type="checkbox" data-theme-toggle role="switch" aria-labelledby="appearance-title">
            <span class="theme-toggle__track" aria-hidden="true"><span class="theme-toggle__thumb"></span></span>
            <span class="theme-toggle__label" data-theme-label>Light</span>
          </label>
        </section>
        <section class="panel">
          <div class="panel__head">
            <div>
              <h2 class="panel__title">Session</h2>
              <p>Sign out of this browser when you are done.</p>
            </div>
          </div>
          <button class="btn btn--ghost" type="button" data-sign-out>Logout</button>
        </section>
      </div>
    </main>
  </div>
</div>
</body>
</html>
