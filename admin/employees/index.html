<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees | Pearls360 Employee Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f1f1ef">
  <link rel="icon" type="image/png" href="/src/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <script src="/boot.js"></script>
  <script type="module" src="/src/pages/admin-employees.js"></script>
</head>
<body data-auth="pending">
<div class="app" data-shell>
  <aside class="sidebar" data-sidebar></aside>
  <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
  <div class="app-body">
    <header class="topbar" data-topbar></header>
    <main class="app-content" id="main">
      <div class="page-toolbar">
        <div>
          <p class="topbar__eyebrow" style="margin:0">Directory</p>
          <p data-directory-count></p>
        </div>
        <div class="page-toolbar__actions">
          <button class="btn" type="button" data-add-employee>Add Employee</button>
        </div>
      </div>

      <section class="panel" aria-labelledby="directory-title">
        <div class="panel__head panel__head--stack">
          <div>
            <h2 class="panel__title" id="directory-title">Employee Directory</h2>
            <p>Search, filter and manage accounts.</p>
          </div>
          <div class="toolbar">
            <div class="field field--search">
              <label for="search">Search</label>
              <div class="field__control"><input id="search" type="search" placeholder="Name, email, ID, department" autocomplete="off"></div>
            </div>
            <div class="field">
              <label for="status-filter">Account</label>
              <div class="field__control">
                <select id="status-filter">
                  <option value="">All accounts</option>
                  <option value="active">Active</option>
                  <option value="pending">Awaiting activation</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="form__alert" data-directory-alert role="alert" hidden><span data-alert-text></span></div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Employee ID</th>
                <th scope="col" class="table__actions"><span class="sr-only">View</span></th>
              </tr>
            </thead>
            <tbody data-rows></tbody>
          </table>
        </div>
        <p class="empty" data-empty hidden>No employees match your search.</p>
      </section>
    </main>
  </div>
</div>

<dialog class="drawer" id="employee-dialog" aria-labelledby="dialog-title">
  <div class="drawer__inner">
    <div class="drawer__head">
      <div>
        <span class="eyebrow eyebrow--plain" data-dialog-eyebrow>Employee</span>
        <h2 class="drawer__title" id="dialog-title">Add Employee</h2>
      </div>
      <button class="drawer__close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="drawer__body">
      <div class="form__alert" data-dialog-alert role="alert" tabindex="-1" hidden><span data-alert-text></span></div>

      <div class="link-box" data-link-box hidden>
        <p data-link-message></p>
        <div class="link-box__row">
          <label class="sr-only" for="access-link">One-time link</label>
          <input id="access-link" type="text" readonly data-link-input>
          <button class="btn btn--sm" type="button" data-copy-link>Copy</button>
        </div>
      </div>

      <form class="form" id="employee-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="firstName">First name</label>
            <div class="field__control"><input id="firstName" name="firstName" autocomplete="off" maxlength="100" required></div>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <div class="field__control"><input id="lastName" name="lastName" autocomplete="off" maxlength="100" required></div>
          </div>
          <div class="field">
            <label for="emp-email">Email</label>
            <div class="field__control"><input id="emp-email" name="email" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="254" required></div>
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <div class="field__control"><input id="phone" name="phone" type="tel" autocomplete="off" maxlength="20" placeholder="Optional"></div>
          </div>
          <div class="field">
            <label for="employeeCode">Employee ID</label>
            <div class="field__control"><input id="employeeCode" name="employeeCode" autocomplete="off" autocapitalize="characters" maxlength="32" required></div>
          </div>
          <div class="field">
            <label for="joiningDate">Joining date</label>
            <div class="field__control"><input id="joiningDate" name="joiningDate" type="date" required></div>
          </div>
          <div class="field">
            <label for="department">Department</label>
            <div class="field__control"><input id="department" name="department" autocomplete="off" maxlength="100" required></div>
          </div>
          <div class="field">
            <label for="designation">Job title / designation</label>
            <div class="field__control"><input id="designation" name="designation" autocomplete="off" maxlength="100" required></div>
          </div>
          <div class="field">
            <label for="employmentStatus">Employment status</label>
            <div class="field__control">
              <select id="employmentStatus" name="employmentStatus" required>
                <option value="active">Active</option>
                <option value="probation">Probation</option>
                <option value="on_leave">On leave</option>
                <option value="resigned">Resigned</option>
                <option value="terminated">Terminated</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit" data-save>Create Employee</button>
          <button class="link" type="button" data-close>Cancel</button>
        </div>
      </form>

      <section class="drawer__section" data-account-section hidden>
        <h3>Account</h3>
        <dl class="details">
          <dt>Status</dt><dd data-account-status></dd>
          <dt>Last sign-in</dt><dd data-last-login></dd>
        </dl>
        <div class="form-actions">
          <button class="btn btn--ghost btn--sm" type="button" data-access-link></button>
          <button class="btn btn--ghost btn--sm" type="button" data-toggle-status></button>
          <button class="btn btn--ghost btn--sm" type="button" data-delete-employee>Delete account</button>
        </div>
      </section>

      <section class="drawer__section" data-history-section hidden>
        <h3>History</h3>
        <ul class="activity" data-history></ul>
      </section>
    </div>
  </div>
</dialog>
</body>
</html>
