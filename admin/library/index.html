<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal Library | Pearls360 Employee Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f1f1ef">
  <link rel="icon" type="image/png" href="/src/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <script src="/boot.js"></script>
  <script type="module" src="/src/pages/admin-documents.js"></script>
</head>
<body data-auth="pending" data-kind="library">
<div class="app" data-shell>
  <aside class="sidebar" data-sidebar></aside>
  <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>
  <div class="app-body">
    <header class="topbar" data-topbar></header>
    <main class="app-content" id="main">
      <section class="dash-intro">
        <h1>Internal Library</h1>
        <p>Company documents stored in the database.</p>
      </section>
      <div class="form__alert" data-page-alert role="alert" hidden><span data-alert-text></span></div>
      <section class="panel">
        <h2 class="panel__title">Upload</h2>
        <form class="form" id="upload-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="title">Title</label>
              <div class="field__control"><input id="title" name="title" maxlength="160" required></div>
            </div>
            <div class="field">
              <label for="category">Category</label>
              <div class="field__control"><input id="category" name="category" maxlength="80" placeholder="Optional"></div>
            </div>
            <div class="field">
              <label for="visibility">Who can open it</label>
              <div class="field__control">
                <select id="visibility" name="visibility">
                  <option value="company">All employees</option>
                  <option value="leadership">Leadership only</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="file">File</label>
              <div class="field__control"><input id="file" name="file" type="file" required></div>
              <p class="field__hint">Any file, up to 2 MB. Employees can open it only while signed in.</p>
            </div>
          </div>
          <button class="btn" type="submit" data-save>Save document</button>
        </form>
      </section>
      <section class="panel">
        <h2 class="panel__title">Documents</h2>
        <ul class="record-list" data-rows></ul>
        <p class="empty" data-empty hidden>No documents yet.</p>
      </section>
    </main>
  </div>
</div>
</body>
</html>
